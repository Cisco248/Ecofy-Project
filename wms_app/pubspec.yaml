name: wms_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  fpdart: ^2.0.0-dev.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  http: ^1.6.0
  font_awesome_flutter: ^10.12.0
  google_maps_flutter: ^2.14.0
  permission_handler: ^12.0.1
  flutter_native_splash: ^2.4.7
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.3
  build_runner: ^2.7.1
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3


flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/logo/logo_l.svg
    - lib/core/assets/logo/white.svg

    - lib/core/assets/icons/apple.svg
    - lib/core/assets/icons/facebook.svg
    - lib/core/assets/icons/google.svg
