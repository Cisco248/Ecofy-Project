name: e_wms_mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  font_awesome_flutter: ^10.10.0
  flutter_svg: ^2.2.0
  provider: any
  flutter_localization: ^0.3.3

dev_dependencies:
  test: any
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true

  assets:
    - path: lib/assets/

    - lib/assets/icons/facebook.svg
    - lib/assets/icons/x.svg
    - lib/assets/icons/google.svg
    - lib/assets/icons/apple.svg

    - lib/assets/images/ravi.jpg
    - lib/assets/images/anouncement_banner_1.jpg
    - lib/assets/images/anouncement_banner_2.jpg
    - lib/assets/images/goal_banner.png
    - lib/assets/images/news_banner.jpg
    - lib/assets/images/Mask_Layer.png

    - lib/assets/logo/logo_l.svg
    - lib/assets/logo/white.svg

